<!DOCTYPE html>
<html lang="th">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบเบิกของ</title>

<style>
*{box-sizing:border-box;font-family:system-ui}
body{
margin:0;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
min-height:100vh;
color:#333;
}

.container{
max-width:480px;
margin:auto;
padding:16px;
}

.card{
background:white;
border-radius:18px;
padding:16px;
margin-bottom:14px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.title{
font-size:20px;
font-weight:700;
color:#2c5364;
margin-bottom:10px;
}

label{
font-size:13px;
color:#666;
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #ddd;
margin-top:6px;
margin-bottom:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.btn-blue{
background:linear-gradient(45deg,#2193b0,#6dd5ed);
color:white;
}

.btn-orange{
background:linear-gradient(45deg,#ff8008,#ffc837);
color:white;
}

.btn-green{
background:linear-gradient(45deg,#11998e,#38ef7d);
color:white;
}

img{
width:100%;
border-radius:12px;
margin-top:10px;
}

#submit{display:none}

.step{
font-size:12px;
background:#eef6ff;
color:#2193b0;
padding:4px 8px;
border-radius:20px;
display:inline-block;
margin-bottom:6px;
}

video{
width:100%;
border-radius:12px;
margin-top:10px;
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<div class="title">ระบบบันทึกเบิกของ</div>
</div>

<div class="card">
<div class="step">ขั้นตอน 1</div>
<label>ทะเบียนรถ</label>
<input id="plate" placeholder="กข 1234">
</div>

<div class="card">
<div class="step">ขั้นตอน 2</div>
<label>ชื่อผู้เบิก</label>
<input id="name" placeholder="ชื่อ - นามสกุล">

<button class="btn-blue" onclick="takeSelfie()">
ถ่ายรูปผู้เบิก
</button>

<video id="cam1" autoplay playsinline style="display:none"></video>
<canvas id="c1" style="display:none"></canvas>
<img id="img1">
</div>

<div class="card">
<div class="step">ขั้นตอน 3</div>
<label>สิ่งของที่เบิก</label>
<input id="item" placeholder="เช่น เครื่องมือช่าง">

<button class="btn-orange" onclick="takeItem()">
ถ่ายรูปสิ่งของ
</button>

<video id="cam2" autoplay playsinline style="display:none"></video>
<canvas id="c2" style="display:none"></canvas>
<img id="img2">
</div>

<div class="card">
<div class="step">ขั้นตอน 4</div>
<label>จำนวน</label>
<input id="qty" type="number">
</div>

<div class="card">
<div class="step">ขั้นตอน 5</div>
<label>วันเวลาเบิก</label>
<input id="datetime" type="datetime-local">
</div>

<div class="card">
<button id="submit" class="btn-green" onclick="send()">
ยืนยันส่งข้อมูล
</button>
</div>

</div>

<script>
let photo1=null
let photo2=null
let latitude=null
let longitude=null

async function startCam(video){
const stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
})
video.srcObject=stream
}

async function takeSelfie(){
const v=cam1
v.style.display="block"
await startCam(v)

setTimeout(()=>{
c1.width=v.videoWidth
c1.height=v.videoHeight
c1.getContext("2d").drawImage(v,0,0)
photo1=c1.toDataURL("image/jpeg")
img1.src=photo1
v.srcObject.getTracks().forEach(t=>t.stop())
v.style.display="none"
check()
},1500)
}

async function takeItem(){
const v=cam2
v.style.display="block"
await startCam(v)

setTimeout(()=>{
c2.width=v.videoWidth
c2.height=v.videoHeight
c2.getContext("2d").drawImage(v,0,0)
photo2=c2.toDataURL("image/jpeg")
img2.src=photo2
v.srcObject.getTracks().forEach(t=>t.stop())
v.style.display="none"
check()
},1500)
}

function getLocation(){
navigator.geolocation.getCurrentPosition((pos)=>{
latitude=pos.coords.latitude
longitude=pos.coords.longitude
})
}

function check(){
if(
plate.value &&
name.value &&
item.value &&
qty.value &&
datetime.value &&
photo1 && photo2
){
getLocation()
submit.style.display="block"
}
}

async function send(){

const text =
`เบิกของ
ทะเบียน: ${plate.value}
ชื่อ: ${name.value}
สิ่งของ: ${item.value}
จำนวน: ${qty.value}
เวลา: ${datetime.value}

Location:
https://maps.google.com/?q=${latitude},${longitude}`

const BOT_TOKEN="8748622486:AAGliuGxb6foxrqgStl_Ey2tzOjCq_CAAD0"
const CHAT_ID="8623749775"

await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup`,{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
chat_id:CHAT_ID,
media:[
{type:"photo",media:photo1,caption:text},
{type:"photo",media:photo2}
]
})
})

alert("ส่งเรียบร้อย")
}
</script>

</body>
</html>
