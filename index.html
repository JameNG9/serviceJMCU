<!DOCTYPE html>
<html lang="th">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบเบิกของ</title>

<style>
*{box-sizing:border-box;font-family:system-ui}
body{
margin:0;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
min-height:100vh;
color:#333;
}

.container{max-width:480px;margin:auto;padding:16px}

.card{
background:white;
border-radius:18px;
padding:16px;
margin-bottom:14px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.title{font-size:20px;font-weight:700;color:#2c5364}

label{font-size:13px;color:#666}

input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #ddd;
margin-top:6px;
margin-bottom:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:600;
cursor:pointer;
margin-top:6px;
}

.btn-blue{background:linear-gradient(45deg,#2193b0,#6dd5ed);color:white}
.btn-orange{background:linear-gradient(45deg,#ff8008,#ffc837);color:white}
.btn-green{background:linear-gradient(45deg,#11998e,#38ef7d);color:white}

img{width:100%;border-radius:12px;margin-top:10px}
video{width:100%;border-radius:12px;margin-top:10px}

.controls{
display:flex;
gap:8px;
margin-top:8px;
}

.controls button{flex:1}

#submit{display:none}

.step{
font-size:12px;
background:#eef6ff;
color:#2193b0;
padding:4px 8px;
border-radius:20px;
display:inline-block;
margin-bottom:6px;
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<div class="title">ระบบบันทึกเบิกของ</div>
</div>

<div class="card">
<div class="step">ขั้นตอน 1</div>
<label>ทะเบียนรถ</label>
<input id="plate">
</div>

<div class="card">
<div class="step">ขั้นตอน 2</div>
<label>ชื่อผู้เบิก</label>
<input id="name">

<button class="btn-blue" onclick="openCam1()">เปิดกล้องผู้เบิก</button>

<video id="cam1" autoplay playsinline style="display:none"></video>

<div id="ctrl1" class="controls" style="display:none">
<button onclick="switchCam(1)">สลับกล้อง</button>
<button onclick="capture1()">ถ่ายรูป</button>
</div>

<canvas id="c1" style="display:none"></canvas>
<img id="img1">
</div>

<div class="card">
<div class="step">ขั้นตอน 3</div>
<label>สิ่งของที่เบิก</label>
<input id="item">

<button class="btn-orange" onclick="openCam2()">เปิดกล้องสิ่งของ</button>

<video id="cam2" autoplay playsinline style="display:none"></video>

<div id="ctrl2" class="controls" style="display:none">
<button onclick="switchCam(2)">สลับกล้อง</button>
<button onclick="capture2()">ถ่ายรูป</button>
</div>

<canvas id="c2" style="display:none"></canvas>
<img id="img2">
</div>

<div class="card">
<div class="step">ขั้นตอน 4</div>
<label>จำนวน</label>
<input id="qty" type="number">
</div>

<div class="card">
<div class="step">ขั้นตอน 5</div>
<label>วันเวลาเบิก</label>
<input id="datetime" type="datetime-local">
</div>

<div class="card">
<button id="submit" class="btn-green" onclick="send()">
ยืนยันส่งข้อมูล
</button>
</div>

</div>

<script>
let photo1=null
let photo2=null
let latitude=null
let longitude=null

let stream=null
let facing="environment"

async function start(video){
if(stream) stream.getTracks().forEach(t=>t.stop())

stream = await navigator.mediaDevices.getUserMedia({
video:{facingMode:facing}
})

video.srcObject=stream
}

function switchCam(id){
facing = facing==="user" ? "environment" : "user"
if(id===1) start(cam1)
else start(cam2)
}

async function openCam1(){
cam1.style.display="block"
ctrl1.style.display="flex"
await start(cam1)
}

async function openCam2(){
cam2.style.display="block"
ctrl2.style.display="flex"
await start(cam2)
}

function capture1(){
c1.width=cam1.videoWidth
c1.height=cam1.videoHeight
c1.getContext("2d").drawImage(cam1,0,0)
photo1=c1.toDataURL("image/jpeg")
img1.src=photo1

stream.getTracks().forEach(t=>t.stop())
cam1.style.display="none"
ctrl1.style.display="none"

check()
}

function capture2(){
c2.width=cam2.videoWidth
c2.height=cam2.videoHeight
c2.getContext("2d").drawImage(cam2,0,0)
photo2=c2.toDataURL("image/jpeg")
img2.src=photo2

stream.getTracks().forEach(t=>t.stop())
cam2.style.display="none"
ctrl2.style.display="none"

check()
}

function getLocation(){
navigator.geolocation.getCurrentPosition(
(pos)=>{
latitude=pos.coords.latitude
longitude=pos.coords.longitude
},
(err)=>{},
{enableHighAccuracy:true}
)
}

function check(){
if(
plate.value &&
name.value &&
item.value &&
qty.value &&
datetime.value &&
photo1 && photo2
){
getLocation()
submit.style.display="block"
}
}

async function send(){

const text =
`เบิกของ
ทะเบียน: ${plate.value}
ชื่อ: ${name.value}
สิ่งของ: ${item.value}
จำนวน: ${qty.value}
เวลา: ${datetime.value}

Location:
https://maps.google.com/?q=${latitude},${longitude}`

const BOT_TOKEN="PUT_YOUR_BOT_TOKEN"
const CHAT_ID="PUT_YOUR_CHAT_ID"

await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup`,{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
chat_id:CHAT_ID,
media:[
{type:"photo",media:photo1,caption:text},
{type:"photo",media:photo2}
]
})
})

alert("ส่งเรียบร้อย")
}
</script>

</body>
</html>
